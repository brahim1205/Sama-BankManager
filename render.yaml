services:
  - type: web
    name: bankmanager
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService: bankmanager
      - key: APP_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: SESSION_DRIVER
        value: cookie
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file
    databases:
      - name: bankmanager-db
        databaseName: bankmanager
        plan: free
        ipAllowList: []
        region: oregon
        user: bankmanager
        postgresMajorVersion: 16
        # When linked, Render will inject DATABASE_URL into the service
